<div class="container mt-4">
  <h3>Proveedores</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <input class="form-control" name="nit" [(ngModel)]="form.nit" placeholder="NIT">
      </div>
      <div class="col-md-4">
        <input class="form-control" name="razonSocial" [(ngModel)]="form.razonSocial" placeholder="Razón social">
      </div>
      <div class="col-md-2">
        <select class="form-select" name="estado" [(ngModel)]="form.estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>NIT</th><th>Razón social</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody>
      @for (p of lista(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nit }}</td>
          <td>{{ p.razonSocial }}</td>
          <td>{{ p.estado }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(p)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(p)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

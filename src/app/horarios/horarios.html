<div class="container mt-4">
  <h3>Horarios</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <input class="form-control" name="nombreHorario" [(ngModel)]="form.nombreHorario" placeholder="Nombre del horario">
      </div>
      <div class="col-md-2">
        <input class="form-control" type="time" name="horaEntrada" [(ngModel)]="form.horaEntrada" title="Hora de entrada">
      </div>
      <div class="col-md-2">
        <input class="form-control" type="time" name="horaSalida" [(ngModel)]="form.horaSalida" title="Hora de salida">
      </div>
      <div class="col-md-5 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Entrada</th><th>Salida</th><th></th></tr>
    </thead>
    <tbody>
      @for (h of lista(); track h.id) {
        <tr>
          <td>{{ h.id }}</td>
          <td>{{ h.nombreHorario }}</td>
          <td>{{ h.horaEntrada }}</td>
          <td>{{ h.horaSalida }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(h)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(h)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

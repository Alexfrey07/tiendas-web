<div class="container mt-4">
  <h3>Departamentos</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-4">
        <input class="form-control" name="nombre" [(ngModel)]="form.nombre" placeholder="Nombre">
      </div>
      <div class="col-md-4">
        <input class="form-control" name="cabecera" [(ngModel)]="form.cabecera" placeholder="Cabecera departamental">
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Cabecera</th><th></th></tr>
    </thead>
    <tbody>
      @for (d of lista(); track d.id) {
        <tr>
          <td>{{ d.id }}</td>
          <td>{{ d.nombre }}</td>
          <td>{{ d.cabecera }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(d)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(d)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

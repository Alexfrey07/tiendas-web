<div class="container mt-4">
  <h3>Sucursales</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <select class="form-select" name="idMunicipio" [(ngModel)]="form.idMunicipio">
          <option [ngValue]="null">-- Municipio --</option>
          @for (m of municipios(); track m.id) {
            <option [ngValue]="m.id">{{ m.nombre }}</option>
          }
        </select>
      </div>
      <div class="col-md-3">
        <input class="form-control" name="nombre" [(ngModel)]="form.nombre" placeholder="Nombre de la sucursal">
      </div>
      <div class="col-md-2">
        <select class="form-select" name="esCabecera" [(ngModel)]="form.esCabecera">
          <option value="S">Es cabecera</option>
          <option value="N">No es cabecera</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" name="estado" [(ngModel)]="form.estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Sucursal</th><th>Municipio</th><th>Cabecera</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody>
      @for (s of lista(); track s.id) {
        <tr>
          <td>{{ s.id }}</td>
          <td>{{ s.nombre }}</td>
          <td>{{ nombreMunicipio(s.idMunicipio) }}</td>
          <td>{{ s.esCabecera === 'S' ? 'Sí' : 'No' }}</td>
          <td>{{ s.estado }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(s)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(s)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

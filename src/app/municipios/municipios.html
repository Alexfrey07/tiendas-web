<div class="container mt-4">
  <h3>Municipios</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-4">
        <select class="form-select" name="idDepartamento" [(ngModel)]="form.idDepartamento">
          <option [ngValue]="null">-- Departamento --</option>
          @for (d of departamentos(); track d.id) {
            <option [ngValue]="d.id">{{ d.nombre }}</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <input class="form-control" name="nombre" [(ngModel)]="form.nombre" placeholder="Nombre del municipio">
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Departamento</th><th>Municipio</th><th></th></tr>
    </thead>
    <tbody>
      @for (m of lista(); track m.id) {
        <tr>
          <td>{{ m.id }}</td>
          <td>{{ nombreDepartamento(m.idDepartamento) }}</td>
          <td>{{ m.nombre }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(m)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(m)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

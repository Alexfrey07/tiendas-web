<div class="container mt-4">
  <h3>Categorías de producto</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-4">
        <input class="form-control" name="nombre" [(ngModel)]="form.nombre" placeholder="Nombre">
      </div>
      <div class="col-md-5">
        <input class="form-control" name="descripcion" [(ngModel)]="form.descripcion" placeholder="Descripción">
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th></th></tr>
    </thead>
    <tbody>
      @for (c of lista(); track c.id) {
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.nombre }}</td>
          <td>{{ c.descripcion }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(c)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(c)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

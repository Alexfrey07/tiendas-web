<div class="container-fluid mt-4 px-4">
  <h3>Clientes</h3>

  @if (mensaje()) {
    <div class="alert alert-info">{{ mensaje() }}</div>
  }

  <form (ngSubmit)="guardar()" class="card card-body mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <input class="form-control" name="nombres" [(ngModel)]="form.nombres" placeholder="Nombres">
      </div>
      <div class="col-md-3">
        <input class="form-control" name="apellidos" [(ngModel)]="form.apellidos" placeholder="Apellidos">
      </div>
      <div class="col-md-2">
        <input class="form-control" name="nit" [(ngModel)]="form.nit" placeholder="NIT">
      </div>
      <div class="col-md-2">
        <input class="form-control" name="dpi" [(ngModel)]="form.dpi" placeholder="DPI">
      </div>
      <div class="col-md-2">
        <select class="form-select" name="estado" [(ngModel)]="form.estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </div>
    </div>
    <div class="row g-2 mt-1">
      <div class="col-md-3">
        <select class="form-select" name="esConsumidorFinal" [(ngModel)]="form.esConsumidorFinal">
          <option value="N">Cliente normal</option>
          <option value="S">Consumidor final</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ form.id ? 'Actualizar' : 'Agregar' }}</button>
        <button class="btn btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Nombres</th><th>Apellidos</th><th>NIT</th><th>DPI</th><th>Tipo</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody>
      @for (c of lista(); track c.id) {
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.nombres }}</td>
          <td>{{ c.apellidos }}</td>
          <td>{{ c.nit }}</td>
          <td>{{ c.dpi }}</td>
          <td>{{ c.esConsumidorFinal === 'S' ? 'Consumidor final' : 'Normal' }}</td>
          <td>{{ c.estado }}</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-warning me-1" (click)="editar(c)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(c)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
